name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  # يتيح لك تشغيل التشغيل التلقائي يدويًا من تبويب Actions
  workflow_dispatch:

# صلاحيات الوصول المطلوبة لرفع الموقع على GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# إلغاء أي عمليات نشر قيد التشغيل إذا تم رفع تحديث جديد
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # رفع كافة ملفات المشروع في الجذر

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4